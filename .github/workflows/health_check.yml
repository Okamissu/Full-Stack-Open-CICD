name: Periodic Health Check

on:
  workflow_dispatch:
  schedule:
    # Runs once every day (at 00:00 UTC) to conserve free build minutes
    - cron: '0 0 * * *'

jobs:
  periodic_health_check:
    runs-on: ubuntu-latest
    steps:
      - name: URL Health Check
        uses: Jtalk/url-health-check-action@v5
        with:
          url: https://full-stack-open-cicd.fly.dev/health
          # Follow HTTP redirects if any
          follow-redirect: true
          # Maximum time to wait for a response in seconds
          max-attempts: 3
          retry-delay: 5s
